<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles Proton Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070913;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.9);
        z-index: 20;
        backdrop-filter: blur(8px);
      }
      #hud .title {
        font-size: 14px;
        font-weight: 600;
      }
      #hud .tips {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.72);
      }
      #hud .value {
        font-size: 12px;
        color: #9dd4ff;
      }
      #hud .btn-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button.active-backend {
        border-color: #5a9fff;
        background: rgba(90, 159, 255, 0.22);
        color: #e8f2ff;
      }
      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        padding: 6px 12px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
    </style>
    <script type="module" crossorigin src="../assets/particles-proton-demo/index-CLmeZaHh.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/render-scene-canvas-BEnEARc8.js">
    <link rel="modulepreload" crossorigin href="../assets/renderGame-8EAIaxer.js">
    <link rel="modulepreload" crossorigin href="../assets/use-audio-xEvP40z0.js">
    <link rel="modulepreload" crossorigin href="../assets/render-scene-webgl-Bffd6VCx.js">
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="hud">
        <div class="title">ParticlesEmitter + Proton</div>
        <div class="tips">点击场景生成一次爆发粒子</div>
        <div id="particles-count" class="value">particles: 0</div>
        <div class="tips">渲染后端：<span id="hud-backend">Canvas 2D</span></div>
        <div class="btn-row">
          <button type="button" id="btn-canvas">Canvas</button>
          <button type="button" id="btn-webgl">WebGL</button>
          <button id="toggle-btn">暂停</button>
          <button id="burst-btn">爆发</button>
        </div>
      </div>
    </div>
  </body>
</html>
