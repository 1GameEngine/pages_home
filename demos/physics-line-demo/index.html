<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Line Demo — 1GameEngine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #070b1f;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #app {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
    }
    #game-container {
      flex: 1; position: relative;
    }
    /* ── 底部控制栏 ── */
    #controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      pointer-events: none;
      z-index: 10;
    }
    #controls > * { pointer-events: auto; }
    .tab-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }
    .tab-btn:hover {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border-color: rgba(255,255,255,0.35);
    }
    .tab-btn.active {
      background: rgba(124,106,239,0.25);
      color: #c4b5fd;
      border-color: rgba(124,106,239,0.5);
    }
    .tab-btn:active { transform: scale(0.96); }
  </style>
  <script type="module" crossorigin src="../assets/physics-line-demo-gVkZ-iWG.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/render-scene-canvas-ClxchRkG.js">
  <link rel="modulepreload" crossorigin href="../assets/renderGame-By1BE4pV.js">
</head>
<body>
  <div id="app">
    <div id="game-container"></div>
    <div id="controls">
      <button class="tab-btn active" data-scene="pendulum">摆锤</button>
      <button class="tab-btn" data-scene="spring">弹簧网</button>
      <button class="tab-btn" data-scene="chain">链条</button>
    </div>
  </div>
</body>
</html>
