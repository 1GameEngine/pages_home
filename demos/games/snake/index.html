<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇游戏 - 1Game Engine Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #0f0f1e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      h1 {
        color: #00ff00;
        font-size: 28px;
        text-align: center;
      }

      #game-container {
        border: 3px solid #00ff00;
        background-color: #1a1a2e;
        box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
      }

      .controls {
        color: #ffffff;
        text-align: center;
        font-size: 14px;
        line-height: 1.8;
      }

      .controls h3 {
        color: #00ff00;
        margin-bottom: 10px;
      }

      .controls p {
        margin: 5px 0;
      }

      .control-item {
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .control-item span {
        background-color: #16213e;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid #00ff00;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 24px;
        }

        .controls {
          font-size: 12px;
        }

        .control-item {
          gap: 10px;
        }

        .control-item span {
          padding: 4px 8px;
          font-size: 12px;
        }
      }
    </style>
    <script type="module" crossorigin src="../../assets/games/snake-du0VF9JQ.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/render-scene-canvas-lBj_UgTE.js">
    <link rel="modulepreload" crossorigin href="../../assets/renderGame-y4Ss6cJo.js">
  </head>
  <body>
    <div class="container">
      <h1>🐍 贪吃蛇游戏</h1>
      <div id="game-container"></div>
      <div class="controls">
        <h3>操作方式</h3>
        <p><strong>PC 端：</strong></p>
        <div class="control-item">
          <span>↑ / W - 上</span>
          <span>↓ / S - 下</span>
          <span>← / A - 左</span>
          <span>→ / D - 右</span>
        </div>
        <div class="control-item">
          <span>Space - 暂停</span>
          <span>R - 重新开始</span>
        </div>
        <p style="margin-top: 15px;"><strong>移动端：</strong>向上/下/左/右滑动屏幕控制蛇移动</p>
      </div>
    </div>
  </body>
</html>
