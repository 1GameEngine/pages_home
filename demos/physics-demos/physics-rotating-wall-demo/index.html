<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Physics Demo - Rotating Wall</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #060916;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #game-container {
        flex: 1;
        position: relative;
        cursor: crosshair;
      }
      #controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        pointer-events: none;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.68));
      }
      #controls > * {
        pointer-events: auto;
      }
      #timeline-panel {
        display: none;
        width: 100%;
        max-width: 540px;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      #timeline-panel.visible {
        display: flex;
      }
      #timeline-label {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.6);
        font-variant-numeric: tabular-nums;
      }
      #timeline-slider {
        width: 100%;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.16);
        outline: none;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
      }
      #timeline-slider::-webkit-slider-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #4f8bff;
        box-shadow: 0 0 8px rgba(79, 139, 255, 0.55);
        -webkit-appearance: none;
        appearance: none;
      }
      #timeline-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: #4f8bff;
        box-shadow: 0 0 8px rgba(79, 139, 255, 0.55);
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn {
        min-width: 110px;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        color: #e5e7eb;
        background: rgba(255, 255, 255, 0.08);
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
        user-select: none;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.42);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .debug-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.78);
        user-select: none;
      }
      .debug-row input {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }
    </style>
    <script type="module" crossorigin src="../../assets/physics-demos/physics-rotating-wall-demo/index-T_K4wzSP.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/render-scene-canvas-BEnEARc8.js">
    <link rel="modulepreload" crossorigin href="../../assets/renderGame-9yEhmnW-.js">
    <link rel="modulepreload" crossorigin href="../../assets/index-DSPGOjZG.js">
    <link rel="modulepreload" crossorigin href="../../assets/index-CMoS-jX_.js">
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="controls">
        <div id="timeline-panel">
          <input id="timeline-slider" type="range" min="0" max="0" value="0" step="1" />
          <div id="timeline-label">0.0s / 0.0s</div>
        </div>
        <div class="debug-row">
          <input id="debug-overlay-check" type="checkbox" />
          <label for="debug-overlay-check">显示物理调试层</label>
        </div>
        <div class="btn-row">
          <button id="engine-btn" class="btn" type="button">引擎: Matter.js</button>
          <button id="pause-btn" class="btn">暂停</button>
          <button id="reset-btn" class="btn">重置</button>
        </div>
      </div>
    </div>
  </body>
</html>
